# Every AWS dependency runs locally in this compose file and is persistent — no
# external emulator (floci) is required. `docker compose up` brings up the whole
# system on its own:
#   S3       -> MinIO           (volume minio_data)
#   DynamoDB -> dynamodb-local  (volume dynamo_data): the catalog AND the durable
#                                transcode job queue (replaces the old in-memory SQS)
# All tables/buckets self-create in-app on first use, so there is no provisioning step.
x-aws-local: &aws-local
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-http://dynamodb-local:8000}
  DYNAMODB_TABLE: ${DYNAMODB_TABLE:-streamsre-catalog}
  QUEUE_TABLE: ${QUEUE_TABLE:-streamsre-transcode-queue}

# Services that touch S3/DynamoDB wait for MinIO + dynamodb-local to be up and
# for the bucket bootstrap (public-read policy) to finish first.
x-storage-deps: &storage-deps
  minio:
    condition: service_started
  dynamodb-local:
    condition: service_started
  storage-bootstrap:
    condition: service_completed_successfully

services:
  # --- MinIO: persistent, S3-compatible object storage ---
  # Durable replacement for floci's in-memory S3. Objects (raw uploads + HLS
  # segments) live on the minio_data volume and survive every restart.
  minio:
    image: minio/minio:latest
    container_name: streamsre-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (browse your objects at http://localhost:9001)
    volumes:
      - minio_data:/data

  # --- One-shot bootstrap: create the two buckets + make segments public-read ---
  # MinIO enforces bucket policies (floci did not), so the origin's anonymous
  # nginx proxy needs the segments bucket set to public download. Idempotent;
  # runs on every `up`. The DynamoDB table + SQS queue still self-heal in-app.
  storage-bootstrap:
    image: minio/mc:latest
    container_name: streamsre-storage-bootstrap
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'waiting for minio...'; sleep 2;
        done
        mc mb -p local/streamsre-raw-uploads
        mc mb -p local/streamsre-hls-segments
        mc anonymous set download local/streamsre-hls-segments
        echo 'storage-bootstrap complete'
    restart: "no"

  # --- Persistent DynamoDB catalog (survives floci restarts) ---
  # dynamodb-local with -sharedDb + a volume; the app self-creates the table.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: streamsre-dynamodb
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamo_data:/data

  # --- Upload API ---
  upload-api:
    build:
      context: ./services/upload-api
      dockerfile: Dockerfile
    container_name: streamsre-upload-api
    env_file: .env
    environment:
      <<: *aws-local
      # Admin credentials gating the write endpoints (upload + create movie).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on: *storage-deps
    ports:
      - "8000:8000"

  # --- Transcode Worker ---
  transcode-worker:
    build:
      context: ./services/transcode-worker
      dockerfile: Dockerfile
    container_name: streamsre-transcode-worker
    env_file: .env
    environment:
      <<: *aws-local
      # Browser-facing origin URL baked into stored manifest URLs.
      ORIGIN_BASE_URL: ${ORIGIN_BASE_URL:-http://localhost:8080}
      # GPU encode: set USE_NVENC=1 AFTER installing nvidia-container-toolkit on
      # the host and uncommenting the `deploy.resources` block below.
      USE_NVENC: ${USE_NVENC:-0}
    depends_on:
      <<: *storage-deps
      # Start the interpolation sidecar first; the worker calls it per job when
      # interpolation is requested, and falls back to native fps if it is down.
      io-framer:
        condition: service_started
    # --- GPU (optional): uncomment once nvidia-container-toolkit is installed ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- I/O Framer (frame interpolation sidecar) ---
  # RIFE FPS boost over Vulkan. The worker calls it per job when interpolation is
  # requested. Defaults to the lavapipe CPU fallback; uncomment the GPU block to
  # move interpolation onto the NVIDIA GPU (needs nvidia-container-toolkit).
  io-framer:
    build:
      context: ./services/io-framer
      dockerfile: Dockerfile
    container_name: streamsre-io-framer
    env_file: .env
    environment:
      <<: *aws-local
      # --- GPU (opt-in, native Linux): uncomment these + the deploy block to run
      # RIFE on the NVIDIA GPU via Vulkan. NOTE: on WSL2 this does NOT bind — the
      # toolkit injects CUDA/NVENC but not the Vulkan ICD, so /healthz still shows
      # backend=cpu (lavapipe). On a non-GPU host the deploy block breaks `up`. ---
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: all
    depends_on: *storage-deps
    ports:
      - "8090:8000"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --- Live ingest (MediaMTX): RTMP / SRT / WHIP push server ---
  # A real encoder (OBS/SRT/browser) pushes here; MediaMTX authorizes the publish
  # against the upload API (stream key) and republishes it internally for the
  # packager to pull. INGEST IS A WRITE PATH — its ports are host/admin-only and
  # are intentionally NOT part of the public `tunnel` profile.
  live-ingest:
    build:
      context: ./services/live-ingest
      dockerfile: Dockerfile
    container_name: streamsre-live-ingest
    depends_on:
      - upload-api        # publish auth is validated by the upload API
    ports:
      - "1935:1935"       # RTMP push (OBS)
      - "8890:8890/udp"   # SRT push
      - "8889:8889"       # WebRTC / WHIP push (browser go-live)
    restart: unless-stopped

  # --- Live packager (ffmpeg): live source -> rolling HLS ladder ---
  # Owns the per-channel live ffmpeg. Re-streams an uploaded title (playout) or
  # pulls the encoder feed from live-ingest, and writes a rolling HLS window to
  # the shared live_segments volume that the origin serves at /live/.
  live-packager:
    build:
      context: ./services/live-packager
      dockerfile: Dockerfile
    container_name: streamsre-live-packager
    env_file: .env
    environment:
      <<: *aws-local
      USE_NVENC: ${USE_NVENC:-0}
      LIVE_INGEST_INTERNAL_HOST: live-ingest:1935
      LIVE_INGEST_API_HOST: live-ingest:9997
    depends_on:
      <<: *storage-deps
      live-ingest:
        condition: service_started
    volumes:
      - live_segments:/live_segments
    ports:
      - "8091:8000"       # host access to /healthz, /metrics, /status
    # --- GPU (opt-in): uncomment + set USE_NVENC=1 for hardware live encode.
    # Live ABR is realtime-critical; NVENC frees the CPU. On WSL2 NVENC binds
    # (unlike the io-framer Vulkan path). On a non-GPU host, leave this commented. ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --- Origin (Nginx) ---
  origin:
    build:
      context: ./services/origin
      dockerfile: Dockerfile
    container_name: streamsre-origin
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *storage-deps
    volumes:
      # Live HLS written by the packager, served read-only at /live/.
      - live_segments:/live-origin:ro
    ports:
      - "8080:8080"

  # --- Beacon Collector ---
  beacon-collector:
    build:
      context: ./services/beacon-collector
      dockerfile: Dockerfile
    container_name: streamsre-beacon-collector
    env_file: .env
    ports:
      - "8001:8001"

  # --- Public gateway + Cloudflare tunnel (opt-in: `--profile tunnel`) ---
  # The gateway is the SINGLE tunnel target: it fans out to upload-api (reads
  # only), beacon-collector and origin by path, and refuses every write/admin
  # path. cloudflared publishes it over an OUTBOUND quick tunnel — no open port,
  # no public IP, no router config. Both are off by default; start them with
  # `docker compose --profile tunnel up` (or ./run.sh --tunnel).
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: streamsre-gateway
    profiles: [tunnel]
    depends_on:
      - upload-api
      - origin
      - beacon-collector
    ports:
      - "8088:8088"   # host access to eyeball the public surface locally

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: streamsre-cloudflared
    profiles: [tunnel]
    depends_on:
      - gateway
    # Quick tunnel: a random *.trycloudflare.com hostname, no account/domain.
    # It changes on every restart, so ./run.sh --tunnel resolves it at runtime.
    # cloudflared keeps running (reconnect loop) rather than exiting, so
    # restart: unless-stopped is safe here (unlike a backend that can exit fast).
    command: tunnel --no-autoupdate --url http://gateway:8088
    restart: unless-stopped

  # --- Frontend (Next.js, served via Nginx in Dockerfile) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamsre-frontend
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_ORIGIN_URL=${VITE_ORIGIN_URL:-http://localhost:8080}
      - VITE_BEACON_URL=${VITE_BEACON_URL:-http://localhost:8001}
      - VITE_GRAFANA_URL=${VITE_GRAFANA_URL:-http://localhost:3000}
      - VITE_PROMETHEUS_URL=${VITE_PROMETHEUS_URL:-http://localhost:9090}
      # Server-side only — used by the /api/tmdb proxy route, never sent to the
      # browser. Runtime env (no rebuild needed to change it).
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    ports:
      - "3001:80"
    depends_on:
      - upload-api
      - origin
      - beacon-collector

  # --- Prometheus ---
  prometheus:
    build:
      context: ./observability/prometheus
      dockerfile: Dockerfile
    container_name: streamsre-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

  # --- Grafana ---
  grafana:
    build:
      context: ./observability/grafana
      dockerfile: Dockerfile
    container_name: streamsre-grafana
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- Alertmanager ---
  alertmanager:
    build:
      context: ./observability/alertmanager
      dockerfile: Dockerfile
    container_name: streamsre-alertmanager
    env_file: .env
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  minio_data:   # persistent S3 objects (raw uploads + HLS segments)
  dynamo_data:  # persistent movie catalog (DynamoDB)
  live_segments:  # rolling live HLS window (packager writes, origin serves)
