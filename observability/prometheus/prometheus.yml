global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/slo_rules.yml"
  - "rules/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "upload-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["upload-api:8000"]

  - job_name: "beacon-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["beacon-collector:8001"]

  - job_name: "transcode-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["transcode-worker:9100"]

  - job_name: "io-framer"
    metrics_path: /metrics
    static_configs:
      - targets: ["io-framer:8000"]

  # Live packager: per-channel encoder health (up, fps, speed-vs-realtime).
  - job_name: "live-packager"
    metrics_path: /metrics
    static_configs:
      - targets: ["live-packager:8000"]

  # Live ingest (MediaMTX): connection/byte counts for the RTMP/SRT/WHIP surface.
  - job_name: "live-ingest"
    metrics_path: /metrics
    static_configs:
      - targets: ["live-ingest:9998"]

  - job_name: "origin-nginx"
    metrics_path: /nginx_status
    static_configs:
      - targets: ["origin:9113"]

