global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/slo_rules.yml"
  - "rules/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "upload-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["upload-api:8000"]

  - job_name: "beacon-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["beacon-collector:8001"]

  - job_name: "transcode-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["transcode-worker:9100"]

  - job_name: "origin-nginx"
    metrics_path: /nginx_status
    static_configs:
      - targets: ["origin:9113"]

