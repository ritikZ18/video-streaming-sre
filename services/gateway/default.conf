# StreamSRE public gateway — the single Cloudflare-tunnel target.
#
# Multiplexes the three public backend surfaces by path so ONE tunnel hostname
# covers everything, and REFUSES every write/admin path so the public tunnel can
# only ever read the catalog, stream video, and accept QoE beacons. The admin
# studio runs on the operator's machine and never goes through here.
#
#   /healthz          -> 200 (tunnel liveness; no upstream)
#   /api/v1/beacon*   -> beacon-collector  (QoE: POST events, GET stats)
#   /api/v1/admin*    -> 403               (never exposed)
#   /api/v1/*  (GET)  -> upload-api        (catalog reads)
#   /api/v1/*  (write)-> 403               (upload/patch/delete/... all blocked)
#   /hls/*            -> origin            (HLS/DASH manifests + CMAF segments)
#   /live/*           -> origin            (live channel HLS; ingest stays host-only)

upstream gw_upload_api { server upload-api:8000; }
upstream gw_origin     { server origin:8080; }
upstream gw_beacon     { server beacon-collector:8001; }

server {
    listen 8088;
    server_name _;

    # Large uploads never traverse the gateway (admin is local), so a small body
    # cap keeps the public surface tight.
    client_max_body_size 4m;

    # --- CORS: single source of truth ---------------------------------------
    # Strip whatever the upstreams set so there is exactly one ACAO on the wire.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;

    # Reflect the caller's origin. This API is intentionally public-read and no
    # credentials/cookies cross the gateway (admin is blocked below), so echoing
    # the origin is safe; Vary: Origin keeps shared caches honest. To lock it to
    # your exact Render URL, replace $http_origin with the literal origin string.
    # `always` so even a 403/404 carries CORS (else the browser hides the status
    # and the app shows "network error" instead of the real reason).
    add_header Access-Control-Allow-Origin   $http_origin always;
    add_header Access-Control-Allow-Methods  "GET, HEAD, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header Access-Control-Max-Age        86400 always;
    add_header Vary                          "Origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Liveness (no auth, no upstream) — the tunnel verifier hits this ------
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- QoE beacons (public: POST events, GET stats) ------------------------
    location /api/v1/beacon {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://gw_beacon;
    }

    # --- Admin surface: never exposed publicly -------------------------------
    location /api/v1/admin {
        return 403;
    }

    # --- Catalog + read-only API (GET/HEAD only) -----------------------------
    # Every write (upload, create, patch, delete, artwork, retranscode,
    # interpolate, cancel) is a non-GET, so this single rule blocks them all.
    location /api/v1/ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD { deny all; }
        proxy_pass http://gw_upload_api;
    }

    # --- Video: HLS/DASH manifests + CMAF segments ---------------------------
    location /hls/ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD { deny all; }
        proxy_pass http://gw_origin;
    }

    # --- Live channels: the rolling HLS window served by the origin ----------
    # Playback only (read-only). Live INGEST (RTMP/SRT/WHIP) is a separate,
    # host-only surface and is never routed through the tunnel.
    location /live/ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD { deny all; }
        proxy_pass http://gw_origin;
    }

    # Nothing else is part of the public surface.
    location / {
        return 404;
    }
}
