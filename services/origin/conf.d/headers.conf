add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
add_header Access-Control-Allow-Headers "Origin, Range, Accept-Encoding, Referer, User-Agent" always;

# Cache-Control is set per content type in default.conf via `expires`
# (playlists = no-cache so updates/patches propagate; segments = long-lived).
# A single global max-age=60 cached master playlists in the browser, which made
# playlist edits appear "not to take" until the cache expired.
