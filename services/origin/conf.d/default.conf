# HLS/DASH origin gateway.
#
# Serves the master.m3u8 (HLS), manifest.mpd (DASH) and the shared CMAF (.m4s)
# segments that the transcode worker writes to the MinIO "segments" bucket,
# with a small nginx cache in front acting as a CDN-edge stand-in.
#
# http-context bits (security/CORS `add_header`s) live in headers.conf, which
# nginx.conf already loads at http scope via `include conf.d/*.conf`. They are
# intentionally NOT re-included here (doing so duplicated every header).
#
# Per-content-type cache TTLs are done with regex locations, NOT a `map` +
# `proxy_cache_valid $var` — nginx does not accept a variable for the cache time.

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=video_cache:10m
                 max_size=1g inactive=60m use_temp_path=off;

upstream object_store {
    # Persistent MinIO object storage (S3-compatible) on the compose network.
    # The segments bucket is public-read (set by the storage-bootstrap service),
    # so this anonymous nginx proxy serves .m3u8/.m4s without signing requests.
    server minio:9000;
}

server {
    listen 8080;
    server_name _;

    # MinIO reflects the browser's Origin into its OWN Access-Control-Allow-Origin
    # response header. Combined with the CORS `add_header`s this origin already
    # sets (headers.conf), the browser then sees two ACAO values
    # ("http://localhost:3001, *") and blocks playback. floci didn't send CORS
    # headers, so this only appeared after moving S3 to MinIO. Strip the upstream's
    # CORS headers here so ours (from headers.conf) are the single source of truth.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    # Drop MinIO's Cache-Control so ours (per-location `expires`) is authoritative.
    proxy_hide_header Cache-Control;

    # Manifests (HLS/DASH): short cache so ABR/playlist refreshes stay responsive.
    #   GET /hls/<job>/master.m3u8 -> MinIO streamsre-hls-segments/<job>/master.m3u8
    location ~ ^/hls/(?<seg>.+\.(?:m3u8|mpd))$ {
        proxy_pass http://object_store/streamsre-hls-segments/$seg;
        proxy_set_header Host $host;
        proxy_cache video_cache;
        proxy_cache_valid 200 5s;
        # Playlists can be re-generated / patched, so never let the browser cache
        # a stale master — always revalidate.
        expires epoch;
    }

    # Media segments: immutable once written, so cache them for a long time.
    location ~ ^/hls/(?<seg>.+\.m4s)$ {
        proxy_pass http://object_store/streamsre-hls-segments/$seg;
        proxy_set_header Host $host;
        proxy_cache video_cache;
        proxy_cache_valid 200 1h;
        # Media segments are immutable once written — cache them hard.
        expires 1h;
    }

    # Anything else under /hls/.
    location /hls/ {
        proxy_pass http://object_store/streamsre-hls-segments/;
        proxy_set_header Host $host;
        proxy_cache video_cache;
        proxy_cache_valid 200 60s;
    }

    # --- Live channels ---------------------------------------------------
    # The live-packager writes a rolling HLS window straight to the shared
    # `live_segments` volume (mounted here read-only at /live-origin). We serve it
    # from disk — NOT via MinIO — because a live playlist changes every few seconds
    # and rides thousands of tiny segments; a local read path is the lowest-latency
    # CDN-edge stand-in. Only `expires` is used (no add_header), so these locations
    # inherit the http-scope CORS/security headers from headers.conf.
    #
    #   GET /live/<event>/master.m3u8 -> /live-origin/<event>/master.m3u8
    location ~ ^/live/(?<lseg>.+\.m3u8)$ {
        alias /live-origin/$lseg;
        # A live playlist mutates constantly — always revalidate. `expires epoch`
        # sets Cache-Control:no-cache WITHOUT an add_header, so this location still
        # inherits the http-scope CORS headers (an add_header here would drop them).
        expires epoch;
    }

    # Live media segments are immutable but short-lived (they roll off the window),
    # so a brief cache smooths bursts without serving anything stale.
    location ~ ^/live/(?<lseg>.+\.(?:ts|m4s|mp4))$ {
        alias /live-origin/$lseg;
        expires 30s;
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }
}
